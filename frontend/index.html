<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeheNAS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>Chế độ xem thử: dữ liệu giả lập, không thao tác trên ổ đĩa thật.</div>
  <div id="auth" class="auth" hidden></div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Mở menu"></button>
      <a class="brand" href="#/overview">
        <img src="/favicon.svg" alt="" width="26" height="26">
        <span class="brand-name">HeheNAS</span>
        <span class="brand-os">OS</span>
      </a>
      <span class="node-pill"><span class="dot"></span><span id="node-name">hehenas</span><small id="version"></small></span>
      <span class="spacer"></span>
      <div class="top-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Đổi giao diện sáng/tối"></button>
        <div class="dropdown" id="notif">
          <button class="icon-btn" id="notif-btn" type="button" aria-label="Thông báo"><span class="badge" id="notif-badge" hidden></span></button>
          <div class="dropdown-menu wide" id="notif-menu" hidden></div>
        </div>
        <div class="dropdown" id="user">
          <button class="user-btn" id="user-btn" type="button"><span class="avatar" id="user-avatar">A</span><span id="user-name"></span></button>
          <div class="dropdown-menu" id="user-menu" hidden></div>
        </div>
      </div>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Điều hướng"></nav>
    <main id="view" class="view"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
