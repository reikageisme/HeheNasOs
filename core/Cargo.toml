[package]
name = "rustnasd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RustNAS management daemon: REST API + embedded web dashboard"
rust-version = "1.80"

[dependencies]
# Only the HTTP/1 + JSON parts of axum: keeps the binary and RAM small.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
argon2 = "0.5"
getrandom = "0.2"
libc = "0.2"

[profile.release]
opt-level = "s"      # size over speed: the Pi 3B is I/O bound, not CPU bound
lto = true
codegen-units = 1
panic = "abort"
strip = true
