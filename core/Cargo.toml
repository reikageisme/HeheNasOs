[package]
name = "rustnasd"
version = "1.0.1"
edition = "2021"
license = "MIT"
description = "RustNAS management daemon: REST API + embedded web dashboard"
rust-version = "1.85"

[dependencies]
# Only the HTTP/1 + JSON parts of axum: keeps the binary and RAM small.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
argon2 = "0.5"
getrandom = "0.2"
libc = "0.2"
# HTTPS with a self-signed certificate generated on first boot (ring backend).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
# A/B system updates: gzip-compressed rootfs + SHA-256 verification (pure Rust).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"

[profile.release]
opt-level = "s"      # size over speed: the Pi 3B is I/O bound, not CPU bound
lto = true
codegen-units = 1
panic = "abort"
strip = true
