name: build

on:
  push:
    branches: [main]
    # Docs and release notes don't need a 1-2 h image build.
    paths-ignore: ['**.md', '.github/release-notes.md', '.github/workflows/release.yml']
  pull_request:
  workflow_dispatch:

# A newer push supersedes older runs (image builds take ~1-2 h).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast check: unit tests, lints, cross-compiled binaries for both boards.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + aarch64 C compiler
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup toolchain install stable --profile minimal -c clippy
          rustup default stable
          rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.toml') }}
      - name: Build (errors become annotations)
        working-directory: core
        run: |
          set +e
          cargo test --no-run --message-format=json > ../build.json
          s=$?
          python3 ../scripts/ci-annotate.py < ../build.json
          exit $s
      - name: Test
        working-directory: core
        shell: bash
        run: |
          set +e
          cargo test 2>&1 | tee ../test.log
          s=${PIPESTATUS[0]}
          if [ "$s" -ne 0 ]; then
            grep -E "panicked at|^test .* FAILED|left:|right:|assertion" ../test.log | head -30 | while IFS= read -r l; do echo "::error title=test::$l"; done
          fi
          exit $s
      - name: Clippy
        # Lints become annotations on the run page; they don't block the build.
        continue-on-error: true
        working-directory: core
        run: |
          cargo clippy --all-targets --message-format=json -- -D warnings > ../clippy.json || true
          python3 ../scripts/ci-annotate.py < ../clippy.json
      - name: Frontend + mock server syntax
        run: |
          node --check frontend/app.js
          node --check dev/mock-server.mjs
      - name: Shell syntax
        run: |
          for f in scripts/*.sh buildroot-external/board/*/*.sh; do bash -n "$f"; done
          for f in buildroot-external/package/rustnas/files/S60ksmbd buildroot-external/board/common/rootfs-overlay/etc/init.d/*; do sh -n "$f"; done
      - name: Cross-compile (aarch64 + x86_64, static musl)
        shell: bash
        run: |
          set +e
          for t in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            TARGET=$t bash scripts/build-core.sh 2>&1 | tee cross.log
            s=${PIPESTATUS[0]}
            if [ "$s" -ne 0 ]; then
              grep -vE '^\s+(Compiling|Downloaded|Downloading)' cross.log | tail -40 | while IFS= read -r l; do echo "::error title=cross $t::$l"; done
              exit $s
            fi
          done
      - name: Smoke test (x86_64 binary, dry-run)
        run: |
          mkdir -p dev/state
          ./core/target/x86_64-unknown-linux-musl/release/rustnasd --config dev/rustnasd.dev.toml &
          PID=$!
          for i in $(seq 1 20); do curl -fsk https://127.0.0.1:8443/api/auth/status && break; sleep 1; done
          echo
          curl -fs -o /dev/null -w "http redirect: %{http_code}\n" http://127.0.0.1:8080/ || true
          code=$(curl -sk -o /dev/null -w "%{http_code}" -X POST https://127.0.0.1:8443/api/auth/setup -H 'Content-Type: application/json' -d '{"username":"admin","password":"testpass123"}')
          echo "setup without CSRF header: $code"; [ "$code" = 403 ]
          code=$(curl -sk -o /dev/null -w "%{http_code}" -X POST https://127.0.0.1:8443/api/auth/setup -H 'X-RustNAS: 1' -H 'Content-Type: application/json' -d '{"username":"admin","password":"testpass123"}')
          echo "setup: $code"; [ "$code" = 200 ]
          code=$(curl -sk -o /dev/null -w "%{http_code}" https://127.0.0.1:8443/api/system/overview)
          echo "overview without session: $code"; [ "$code" = 401 ]
          kill $PID
      - uses: actions/upload-artifact@v4
        with:
          name: rustnasd-binaries
          path: |
            core/target/aarch64-unknown-linux-musl/release/rustnasd
            core/target/x86_64-unknown-linux-musl/release/rustnasd

  # Full OS images (Buildroot). Main pushes and manual runs only.
  image:
    needs: core
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        board: [rpi3, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BOARD: ${{ matrix.board }}
      RUSTNAS_WORK: ${{ github.workspace }}/../rustnas-build
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Buildroot needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null || true
          df -h /
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git rsync bc cpio unzip wget file perl python3 patch xz-utils libncurses-dev gcc-aarch64-linux-gnu
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../rustnas-build/buildroot/dl
          key: br-dl-${{ matrix.board }}-${{ hashFiles('buildroot-external/configs/*') }}
          restore-keys: br-dl-${{ matrix.board }}-
      - name: Build image
        run: bash scripts/build-image.sh
      - name: Build info
        if: always()
        run: |
          ls -lh dist/ || true
          ls -lh "$RUSTNAS_WORK/output-$BOARD/images/" || true
          grep -E '^BR2_(TOOLCHAIN_USES_MUSL|PACKAGE_(KSMBD_TOOLS|RUSTNAS|NFS_UTILS|NFTABLES|SMARTMONTOOLS|UTIL_LINUX_FDISKS|UTIL_LINUX_WIPEFS|RPI_FIRMWARE_CD)|TOOLCHAIN_EXTERNAL_BOOTLIN.*|TARGET_ROOTFS_ISO9660.*)=' "$RUSTNAS_WORK/output-$BOARD/.config" || true
      - uses: actions/upload-artifact@v4
        with:
          name: rustnas-${{ matrix.board }}
          path: dist/*
          compression-level: 0
