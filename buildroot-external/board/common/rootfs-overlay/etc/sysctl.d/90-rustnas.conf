# Memory tuning for 1 GB RAM with zram swap
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.min_free_kbytes = 16384
# Flush writes to USB disks sooner (less data lost on a power cut)
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Socket buffers sized for 100 Mbit Ethernet
net.core.rmem_max = 1048576
net.core.wmem_max = 1048576
